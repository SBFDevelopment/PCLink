name: 'Release VCC Package'

on:
  push:
    branches:
      - release

# Fix: Explicitly grant permissions to fetch OIDC tokens and commit changes
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Secure Installation Token from VPS
        id: fetch-token
        run: |
          # Request the OIDC ID Token from the runner context
          ACTIONS_TOKEN=$(curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://development.chirpter.com" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          
          # Send it to your Dokploy Proxy to fetch a real GitHub App context token
          VPM_TOKEN=$(curl -s -X POST https://development.chirpter.com/api/request-token \
            -H "Authorization: Bearer $ACTIONS_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.token')
          
          # Mask the token so it never prints in plain text in logs
          echo "::add-mask::$VPM_TOKEN"
          echo "token=$VPM_TOKEN" >> $GITHUB_OUTPUT

      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
          token: ${{ steps.fetch-token.outputs.token }}

      - name: Checkout version manifest
        uses: actions/checkout@v4
        with:
          path: versions
          repository: SBFDevelopment/vcc-manifest
          token: ${{ steps.fetch-token.outputs.token }}

      # Pro Tip: actions/checkout@v4 is the stable, standard version. v6 does not exist yet.
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          package_json_file: repo/.github/scripts/package.json
          standalone: true

      - name: Run Bundle & Version Auto-Bump
        working-directory: repo/.github/scripts
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pnpm install --frozen-lockfile
          node bundle.js "$GITHUB_WORKSPACE/repo" "$GITHUB_WORKSPACE/versions"

      - name: Push central version manifest
        working-directory: versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "Register package update from ${{ github.repository }}@$GITHUB_SHA" && git push)
